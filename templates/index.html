<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stockometer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/src/logo1-cropped.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='src/loader.css') }}">
</head>
<body data-error-state="{% if error_message %}visible{% else %}none{% endif %}">

    <div class="loading-overlay{% if error_message %} is-visible is-returning{% endif %}" id="loading-overlay" aria-hidden="{% if error_message %}false{% else %}true{% endif %}">
        <div class="loading-panel" role="status" aria-live="polite">
            <div class="loader"></div>
            <p class="loading-text" id="loading-text">Checking the symbol...</p>
        </div>
    </div>

    <div class="wrapper">
        <h1 class="title">Stockometer</h1>
        <p class="subtitle">Analyze historical performance in seconds</p>

        <form method="POST" action="/analyze" class="form" id="analyze-form">

            <div class="symbol-input autocomplete">
                <input 
                    id="symbol-input"
                    type="text" 
                    name="symbol" 
                    value="{{ symbol_value or '' }}"
                    placeholder="Enter stock symbol (e.g. AAPL, TSLA, INFY.NS)"
                    autocomplete="off"
                    autocapitalize="characters"
                    aria-autocomplete="list"
                    aria-controls="symbol-suggestions"
                    aria-expanded="false"
                    aria-haspopup="listbox"
                    role="combobox"
                    required
                >
                <div
                    id="symbol-suggestions"
                    class="suggestions"
                    role="listbox"
                    hidden
                ></div>
            </div>

            {% if error_message %}
            <p class="form-error form-error-enter" id="form-error" role="alert">{{ error_message }}</p>
            {% endif %}

            <button type="submit">Analyze</button>

        </form>

        <!-- ✅ MOVED: Trending below button -->
        <div class="trending-section">
            <p class="trending-label">POPULAR</p>
            <div class="popular-region-filter" id="popular-region-filter" role="radiogroup" aria-label="Popular stocks by region">
                <label class="popular-region-option"><input type="radio" name="popular-region" value="US" checked><span>US</span></label>
                <label class="popular-region-option"><input type="radio" name="popular-region" value="EUROPE"><span>EUROPE</span></label>
                <label class="popular-region-option"><input type="radio" name="popular-region" value="CHINA"><span>CHINA</span></label>
                <label class="popular-region-option"><input type="radio" name="popular-region" value="INDIA"><span>INDIA</span></label>
                <label class="popular-region-option"><input type="radio" name="popular-region" value="UK"><span>UK</span></label>
                <label class="popular-region-option"><input type="radio" name="popular-region" value="KOREA"><span>KOREA</span></label>
            </div>
            <div class="trending-list" id="trending-list">
                <button type="button" class="trend-item" data-symbol="AAPL">AAPL</button>
                <button type="button" class="trend-item" data-symbol="MSFT">MSFT</button>
                <button type="button" class="trend-item" data-symbol="NVDA">NVDA</button>
                <button type="button" class="trend-item" data-symbol="AMZN">AMZN</button>
                <button type="button" class="trend-item" data-symbol="GOOGL">GOOGL</button>
                <button type="button" class="trend-item" data-symbol="META">META</button>
                <button type="button" class="trend-item" data-symbol="TSLA">TSLA</button>
                <button type="button" class="trend-item" data-symbol="JPM">JPM</button>
                <button type="button" class="trend-item" data-symbol="RELIANCE.NS">RELIANCE.NS</button>
                <button type="button" class="trend-item" data-symbol="TCS.NS">TCS.NS</button>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
